name: Run Tests
on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        # Standard 'apt' for v2.x, or specific versions for v3.x
        taskwarrior-version: [apt, 3.4.2]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Taskwarrior
      run: |
        if [ "${{ matrix.taskwarrior-version }}" = "apt" ]; then
          sudo apt-get update && sudo apt-get install -y taskwarrior
        else
          VERSION="${{ matrix.taskwarrior-version }}"
          # Install build dependencies
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libuuid1 uuid-dev gnutls-bin libgnutls28-dev
          
          # For Taskwarrior 3.x, we need Rust
          if [[ $VERSION == 3* ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
          fi

          URL="https://github.com/GothenburgBitFactory/taskwarrior/releases/download/v${VERSION}/task-${VERSION}.tar.gz"
          echo "Downloading $URL"
          curl -L -o "task.tar.gz" "$URL"
          tar xzf "task.tar.gz"
          cd "task-${VERSION}"
          cmake -DCMAKE_BUILD_TYPE=Release .
          make
          sudo make install
          cd ..
        fi
        task --version

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r test_requirements.txt
        pip install -e .

    - name: Run Tests
      run: |
        pytest